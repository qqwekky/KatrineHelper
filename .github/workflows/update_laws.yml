name: Обновление базы законов

on:
  schedule:
    - cron: "17 3 */10 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python tools/parse_laws.py
      - name: Commit
        run: |
          git config user.name "law-bot"
          git config user.email "law-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Обновление базы законов"
          git push
